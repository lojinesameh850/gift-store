<div class="product-card">
  <div class="image-container">
    <img 
      *ngIf="product?.images?.length" [src]="product.images[0]" [alt]="product?.name || 'product image'" />
    <ng-template #noImage>
      <div class="placeholder-icon">🎁</div>
    </ng-template>
  </div>

  <div class="card-body">
    <h3 class="product-name">{{ product?.name }}</h3>

    <div class="card-footer">
      <span class="product-price">EGP {{ product?.price }}</span>
      <div class="actions">
        <button
          class="wishlist-btn"
          [ngClass]="{ 'active': isInWishlist }"
          [disabled]="isWishlistLoading"
          (click)="onToggleWishlist()"
          [attr.aria-label]="isInWishlist ? 'Remove from wishlist' : 'Add to wishlist'"
        >{{ isInWishlist ? '♥' : '♡' }}</button>
        <button class="add-btn" [disabled]="isLoading" (click)="onAddToCart()" aria-label="Add to cart">+</button>
      </div>
    </div>
  </div>
</div>
