<app-hero-banner></app-hero-banner>

<section class="container-fluid px-4 px-lg-5 py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="section-title mb-0">Featured Products</h2>
    <a routerLink="/shop" class="see-all-link">See All</a>
  </div>

  @if (featuredProducts.isLoading()) {
    <p class="text-muted">Loading featured gifts...</p>
  } @else if (!featuredProducts.value()?.length) {
    <p class="text-muted">No featured products available right now.</p>
  } @else {
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-2">
      @for (product of featuredProducts.value(); track product.id) {
        <div class="col">
          <app-product-card [product]="product"></app-product-card>
        </div>
      }
    </div>
  }
</section>
