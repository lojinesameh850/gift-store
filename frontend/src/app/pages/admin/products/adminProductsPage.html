<div class="page-header">
  <h1>Products</h1>
  <button class="btn-primary" (click)="openAddModal()">+ Add Product</button>
</div>

<div class="toolbar">
  <div class="search-input">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
    <input type="text" placeholder="Search products..." [value]="searchTerm()" (input)="onSearchInput($event)" />
  </div>

  <div class="filter-select">
    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
    </svg>
    <select [value]="selectedCategoryFilter() ?? ''" (change)="onCategoryFilterChange($event)">
      <option value="">All Categories</option>
      <option *ngFor="let opt of categoryOptions()" [value]="opt.value">{{ opt.label }}</option>
    </select>
  </div>
</div>

<div *ngIf="isLoading()" class="empty-state">Loading products...</div>

<div *ngIf="!isLoading()" class="table-card">
  <table class="products-table">
    <thead>
    <tr>
      <th>Product</th>
      <th>Category</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Status</th>
      <th class="actions-col"></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let p of products()">
      <td>
        <div class="product-cell">
          <img *ngIf="p.images?.length" [src]="p.images[0]" class="thumb" alt="" />
          <span *ngIf="!p.images?.length" class="thumb thumb-placeholder"></span>
          <span class="product-name">{{ p.name }}</span>
        </div>
      </td>
      <td class="category-cell">{{ categoryName(p.category) }}</td>
      <td class="price-cell">EGP {{ p.price }}</td>
      <td>{{ p.stock }}</td>
      <td>
          <span class="status-pill" [class]="stockStatus(p.stock).severity">
            {{ stockStatus(p.stock).label }}
          </span>
      </td>
      <td>
        <div class="actions">
          <button class="icon-btn" (click)="openEditModal(p)" title="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </button>
          <button class="icon-btn danger" (click)="onDelete(p)" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>

  <div *ngIf="products().length === 0" class="empty-state">No products found matching your criteria.</div>
</div>

<div *ngIf="!isLoading() && totalPages() > 1" class="pagination">
  <button class="page-btn" [disabled]="page() === 1" (click)="prevPage()">‹</button>
  <button
    class="page-btn"
    *ngFor="let n of pageNumbers()"
    [class.active]="n === page()"
    (click)="goToPage(n)"
  >
    {{ n }}
  </button>
  <button class="page-btn" [disabled]="page() === totalPages()" (click)="nextPage()">›</button>
</div>

<!-- Add/Edit Modal -->
<div class="modal-backdrop" *ngIf="showModal()">
  <div class="modal-box">
    <h3>{{ editingId() ? 'Edit Product' : 'Add Product' }}</h3>

    <form [formGroup]="productForm" (ngSubmit)="onSave()" class="product-form">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" formControlName="name" class="form-control" />
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea formControlName="description" rows="3" class="form-control"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Price (EGP) *</label>
          <input type="number" min="0" formControlName="price" class="form-control" />
        </div>
        <div class="form-group">
          <label>Stock *</label>
          <input type="number" min="0" formControlName="stock" class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label>Category *</label>
        <select formControlName="category" class="form-control">
          <option [ngValue]="null" disabled>Select a category</option>
          <option *ngFor="let opt of categoryOptions()" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tags</label>
        <div class="tag-checkbox-list">
          <label class="tag-checkbox" *ngFor="let t of tags()">
            <input type="checkbox" [checked]="isTagSelected(t._id)" (change)="toggleTag(t._id)" />
            {{ t.name }}
          </label>
        </div>
      </div>

      <div class="checkbox-row">
        <label><input type="checkbox" formControlName="isFeatured" /> Featured</label>
        <label><input type="checkbox" formControlName="isActive" /> Active</label>
      </div>

      <p class="error-text" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="productForm.invalid || isSaving()">
          {{ isSaving() ? 'Saving...' : 'Save Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
