<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
        <path d="M20 12v9H4v-9M2 7h20v5H2V7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C10 2 12 7 12 7Zm0 0h4.5a2.5 2.5 0 1 0 0-5C14 2 12 7 12 7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Hadeya</span>
    </div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join Hadeya to start gifting with heart</p>

    <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" formControlName="firstName" class="form-control" placeholder="Jane" autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" formControlName="lastName" class="form-control" placeholder="Howard" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="At least 8 characters"
          autocomplete="new-password"
        />
        <span class="field-hint" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']">
          Password must be at least 8 characters long.
        </span>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          formControlName="confirmPassword"
          class="form-control"
          placeholder="Re-enter your password"
          autocomplete="new-password"
        />
        <span class="field-hint" *ngIf="registerForm.get('confirmPassword')?.errors?.['mismatch']">
          Passwords do not match.
        </span>
      </div>

<!--      <div class="checkbox-group">-->
<!--        <label>-->
<!--          <input type="checkbox" formControlName="agreeToTerms" />-->
<!--          I agree to the Terms of Service and Privacy Policy-->
<!--        </label>-->
<!--      </div>-->

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login" class="link">Log In</a>
    </p>
  </div>
</div>
