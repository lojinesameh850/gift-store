<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
        <path d="M20 12v9H4v-9M2 7h20v5H2V7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C10 2 12 7 12 7Zm0 0h4.5a2.5 2.5 0 1 0 0-5C14 2 12 7 12 7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Hadeya</span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to continue your gift-giving journey</p>

    <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="••••••••"
          autocomplete="off"
        />
      </div>

      <div class="forgot-row">
        <a routerLink="/auth/forgot-password" class="link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/auth/register" class="link">Sign Up</a>
    </p>
  </div>
</div>
