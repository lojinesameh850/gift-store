<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
        <path d="M20 12v9H4v-9M2 7h20v5H2V7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 22V7M12 7H7.5a2.5 2.5 0 1 1 0-5C10 2 12 7 12 7Zm0 0h4.5a2.5 2.5 0 1 0 0-5C14 2 12 7 12 7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Hadeya</span>
    </div>

    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-subtitle">Enter your email and we'll send you a reset code</p>

    <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="requestForm" (ngSubmit)="onRequestCode()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" placeholder="you@example.com" autocomplete="email" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="requestForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Sending...' : 'Send Reset Code' }}
      </button>
    </form>

    <p class="auth-footer">
      Remembered your password? <a routerLink="/auth/login" class="link">Log In</a>
    </p>
  </div>
</div>
