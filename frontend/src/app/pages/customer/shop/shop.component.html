<div class="shop-page">
  <!-- Header Section -->
  <header class="shop-header">
    <div class="header-titles">
      <h1>Shop All Gifts</h1>
      <span class="product-count">{{ products.length }} products</span>
    </div>
    <div class="sort-container">
      <label for="sort">Sort by:</label>
      <select id="sort" (change)="onSortChange($event)">
        <option value="newest">Newest</option>
        <option value="lowest-price">Price: Low to High</option>
        <option value="highest-price">Price: High to Low</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>
  </header>

  <!-- Main Content Area -->
  <div class="shop-content">
    <!-- Sidebar Filters -->
    <aside class="sidebar">
      <!-- Category Filter -->
      <div class="filter-group">
        <h4>Category</h4>
        <ul>
          <li *ngFor="let category of categories">
            <label>
              <input
                type="checkbox"
                [value]="category.name"
                (change)="onCategorySelect($event, category)"
              />
              <span>{{ category.name }}</span>
            </label>
          </li>
        </ul>
      </div>

      <!-- Price Range Filter -->
      <div class="filter-group">
        <h4>Price Range</h4>
        <ul>
          <li>
            <label
              ><input
                type="checkbox"
                (change)="onPriceRangeSelect($event, 'under-250')"
              />
              Under EGP 250</label
            >
          </li>
          <li>
            <label
              ><input
                type="checkbox"
                (change)="onPriceRangeSelect($event, '250-500')"
              />
              EGP 250 - 500</label
            >
          </li>
          <li>
            <label
              ><input
                type="checkbox"
                (change)="onPriceRangeSelect($event, '500-1000')"
              />
              EGP 500 - 1000</label
            >
          </li>
          <li>
            <label
              ><input
                type="checkbox"
                (change)="onPriceRangeSelect($event, 'above-1000')"
              />
              Above EGP 1000</label
            >
          </li>
        </ul>
      </div>

      <!-- Tags / Occasion Filter -->
      <div class="filter-group">
        <h4>Tags</h4>
        <ul>
          <li *ngFor="let tag of tags">
            <label>
              <input
                type="checkbox"
                [value]="tag.name"
                (change)="onTagSelect($event, tag)"
              />
              <span>{{ tag.name }}</span>
            </label>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Product Grid & Pagination Container -->
    <div class="products-section">
      <main class="products-grid">
        <app-product-card
          *ngFor="let product of products"
          [product]="product"
        ></app-product-card>
      </main>

      <!-- Pagination Controls -->
      <div class="pagination">
        <button class="page-btn nav-btn">&lt;</button>
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <button class="page-btn nav-btn">&gt;</button>
      </div>
    </div>
  </div>
</div>
