<div class="shop-page">
  <header class="shop-header">
    <div class="header-titles">
      <h1>Shop All Gifts</h1>
      <span class="product-count">{{ products?.length || 0 }} products</span>
    </div>
      <div class="sort-container">
        <label for="sort">Sort by:</label>
        <select id="sort" (change)="onSortChange($event)">
          <option value="newest">Newest</option>
          <option value="lowest-price">Price: Low to High</option>
          <option value="highest-price">Price: High to Low</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>
  </header>

  <div class="shop-content">
    <aside class="sidebar">
      <div class="filter-group">
        <h4>Category</h4>
        <ul>
          <li *ngFor="let category of categories">
            <label>
              <input 
                type="checkbox" [value]="category._id || category.id" (change)="onCategorySelect($event, category)" />
              <span>{{ category.name }}</span>
            </label>
          </li>
        </ul>
      </div>

      <div class="filter-group">
  <h4>Price Range</h4>
  <ul>
    <li>
      <label>
        <input type="checkbox" (change)="onPriceSelect(null, 250)" /> Under EGP 250
      </label>
    </li>
    <li>
      <label>
        <input type="checkbox" (change)="onPriceSelect(250, 500)" /> EGP 250 - 500
      </label>
    </li>
    <li>
      <label>
        <input type="checkbox" (change)="onPriceSelect(500, 1000)" /> EGP 500 - 1000
      </label>
    </li>
  </ul>
</div>

      <div class="filter-group">
        <h4>Tags</h4>
        <ul>
          <li *ngFor="let tag of tags">
            <label>
              <input 
                type="checkbox" 
                [value]="tag._id || tag.id" 
                (change)="onTagSelect($event, tag)" 
              />
              <span>{{ tag.name }}</span>
            </label>
          </li>
        </ul>
      </div>
    </aside>

    <div class="products-section">
      <main class="products-grid">
        <app-product-card *ngFor="let product of products" [product]="product"></app-product-card>
      </main>

      <div class="pagination" *ngIf="totalPages >= 1">
       <button class="page-btn" [disabled]="currentPage === 1" (click)="onPageChange(currentPage - 1)"> &lt; </button>

       <button *ngFor="let page of pages" class="page-btn"[class.active]="page === currentPage"(click)="onPageChange(page)">  {{ page }}</button>

       <button class="page-btn" [disabled]="currentPage === totalPages" (click)="onPageChange(currentPage + 1)"> &gt;</button>
     </div>
    </div>
  </div>
</div>
