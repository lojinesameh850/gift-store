<div class="section-wrapper">
  <div class="wishlist-heading">
    <h2 class="section-subtitle">My Wishlist</h2>
    <span class="item-count" *ngIf="!isLoading()">{{ items().length }} item{{ items().length === 1 ? '' : 's' }}</span>
  </div>

  <div *ngIf="isLoading()" class="empty-card">
    <p class="text-muted">Loading your wishlist...</p>
  </div>

  <ng-container *ngIf="!isLoading()">
    <div *ngIf="items().length > 0; else emptyWishlist" class="wishlist-grid">
      <div class="wishlist-card" *ngFor="let item of items()">
        <div class="wishlist-image">
          <img *ngIf="item.images?.length" [src]="item.images[0]" [alt]="item.name" />
          <svg *ngIf="!item.images?.length" class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="8" width="18" height="4" rx="1"></rect>
            <path d="M12 8v13"></path>
            <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path>
            <path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8"></path>
            <path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8"></path>
          </svg>
          <span class="badge-outofstock" *ngIf="item.stock === 0">Out of Stock</span>
        </div>

        <div class="wishlist-info">
          <a class="wishlist-name" [routerLink]="['/products', item.slug]">{{ item.name }}</a>
          <div class="wishlist-price-row">
            <div class="wishlist-price-group">
              <span class="wishlist-price">EGP {{ discountedPrice(item) }}</span>
              <span class="wishlist-price-original" *ngIf="item.discount">EGP {{ item.price }}</span>
            </div>
            <button
              class="remove-circle-btn"
              (click)="onRemove(item)"
              [disabled]="removingId() === item._id"
              title="Remove from wishlist"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #emptyWishlist>
      <div class="empty-card">
        <p class="text-muted">Your wishlist is empty. Save products you love to find them here later.</p>
        <button class="btn-primary-sm" (click)="goToProducts()">Browse Products</button>
      </div>
    </ng-template>
  </ng-container>
</div>
